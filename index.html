<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-4">
        <div class="row g-4">
            <div class="col-md-6">
                <div class="main-card">
                    <h4>Student Information</h4>

                    <form id="resultForm">
                        <label class="form-label">Student Name</label>
                        <input type="text" id="name" class="form-control mb-3" placeholder="Enter student name"
                            required>

                        <h6 class="mt-3 mb-3">Subject Marks <small>(Out of 100)</small></h6>

                        <div class="row">
                            <div class="col-sm-6 mb-3">
                                <label class="form-label">English</label>
                                <input type="number" id="english" class="form-control" min="0" max="100" required>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="form-label">Mathematics</label>
                                <input type="number" id="math" class="form-control" min="0" max="100" required>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="form-label">Computer</label>
                                <input type="number" id="computer" class="form-control" min="0" max="100" required>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="form-label">Physics</label>
                                <input type="number" id="physics" class="form-control" min="0" max="100" required>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="form-label">Urdu</label>
                                <input type="number" id="urdu" class="form-control" min="0" max="100" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-2">
                            Calculate Result
                        </button>
                        <p id="message" class="text-danger mt-3 mb-0"></p>
                    </form>
                </div>
            </div>

            <div class="col-md-6">
                <div class="result-card">
                    <h5>Result Summary</h5>
                    <p class="small text-secondary">Your calculated result will appear here.</p>
                    <div id="result" class="result-box">
                        <p class="text-secondary mb-0">No result yet. Fill in the form first.</p>
                    </div>
                </div>
            </div>
        </div>

        <p class="footer mt-4">Student Result System | JavaScript Practice Project</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
